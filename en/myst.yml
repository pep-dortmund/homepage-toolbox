# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: PeP et al. Toolbox Workshop
  license:
    code: MIT
    content: CC-BY-4.0
  toc:
    # Auto-generated by `myst init --write-toc`
    - file: index.md
    - file: notes.md
      title: Material
    - file: problem.md
      title: Hilfe
    - file: about.md
    - file: archive.md
    - file: links.md

    # Current Notebooks
    - pattern: files/archive/current/*.ipynb
      hidden: true
    
    # Previous Notebooks
    - pattern: files/archive/latest/*.ipynb
      hidden: true

  plugins:
    - https://github.com/jupyter-book/myst-plugins/releases/download/footer-latest/index.mjs
    - https://github.com/choldgraf/myst-iconify/releases/latest/download/index.mjs

site:
  projects:
    - slug: main
      path: .
    - slug: install
      path: install
    - slug: introduction
      path: introduction
    - slug: current
      path: files/archive/current

  nav:
    - title: Installation
      url: /install
    - title: Getting Started
      url: /introduction
    - title: Material
      url: /main/notes
    - title: Help
      url: /main/problem
    - title: More
      children:
        - title: About
          url: /main/about
        - title: Archive
          url: /main/archive
        - title: Links
          url: /main/links

  options:
    favicon: _static/pep_neg.svg
    logo: _static/pep_neg.svg
    logo_text: Toolbox Workshop
    logo_url: /en/main
    style: _static/custom.css

  parts:
    banner: _parts/banner_en.md
    footer: _parts/footer_en.md
    navbar_end: _parts/lang_switch_de.md
